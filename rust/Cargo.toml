[package]
name = "kbmixer"
version = "3.0.0"
edition = "2021"
description = "Keyboard and Mouse Audio Mixer - Control application volume with hotkeys and mouse wheel"
license = "MIT"
build = "build.rs"

# Deliberately no [dependencies]: everything talks to Win32 / COM through hand-written FFI in src/win.rs.

[[bin]]
name = "KBMixer"
path = "src/main.rs"

[profile.release]
# "s": ~15% smaller than 3 for ~5% slower full-window paints (3.8 ms vs 3.6 ms); "z" doubles paint time.
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev]
panic = "abort"
