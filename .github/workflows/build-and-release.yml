# Build and publish a Windows release on every push to main.
# Uses GITHUB_TOKEN (no extra secrets). Release tag: v{csproj-version}-r{run_number}.

name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Get version from project
        id: version
        run: |
          $lines = dotnet msbuild KBMixer\KBMixer.csproj -getProperty:Version -nologo
          $v = ($lines | Where-Object { $_.Trim() -ne '' } | Select-Object -First 1).Trim()
          if ([string]::IsNullOrWhiteSpace($v)) { throw "Could not read Version from KBMixer.csproj" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained single file (Release, win-x64)
        run: >
          dotnet publish KBMixer\KBMixer.csproj
          -c Release
          -o "${{ github.workspace }}\artifacts\publish"
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          --verbosity minimal

      - name: Publish framework-dependent (Release, win-x64)
        run: >
          dotnet publish KBMixer\KBMixer.csproj
          -c Release
          -o "${{ github.workspace }}\artifacts\publish-fd"
          -p:SelfContained=false
          -p:WindowsAppSDKSelfContained=false
          -p:PublishReadyToRun=false
          -p:PublishSingleFile=false
          --verbosity minimal

      - name: Zip framework-dependent publish
        run: >
          Compress-Archive
          -Path "${{ github.workspace }}\artifacts\publish-fd\*"
          -DestinationPath "${{ github.workspace }}\artifacts\KBMixer-framework-dependent.zip"
          -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-r${{ github.run_number }}
          name: KBMixer v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automated build from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on `main`.

            **Downloads (win-x64):**

            - `KBMixer.exe` — **self-contained single-file** publish. Runs on a 64-bit Windows 10 1903+ machine with nothing else installed; dependencies are extracted to a temporary directory on first launch.
            - `KBMixer-framework-dependent.zip` — **framework-dependent** publish. Much smaller and starts faster, but requires the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) and the [Windows App SDK 2.5 runtime](https://learn.microsoft.com/windows/apps/windows-app-sdk/downloads) to be installed. Unzip anywhere and run `KBMixer.exe`.
          files: |
            artifacts/publish/KBMixer.exe
            artifacts/KBMixer-framework-dependent.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
