# Build and publish a Windows release on every push to main.
# Uses GITHUB_TOKEN (no extra secrets). Release tag: v{rust/Cargo.toml version}-r{run_number}.

name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: rust
    env:
      # Use the toolchain's bundled MinGW linker, not whatever gcc the runner has on PATH.
      RUSTFLAGS: -C link-self-contained=yes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The GNU host toolchain ships its own linker; this is the configuration the release exe is built and tested with.
      - name: Install Rust toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - name: Get version from Cargo.toml
        id: version
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $m) { throw "Could not read version from rust/Cargo.toml" }
          "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo +stable-x86_64-pc-windows-gnu test --locked

      - name: Build release
        run: cargo +stable-x86_64-pc-windows-gnu build --release --locked

      - name: Check the exe is standalone and versioned
        run: |
          ./tools/check-imports.ps1 -Path target\release\KBMixer.exe
          $exe = Get-Item target\release\KBMixer.exe
          $v = $exe.VersionInfo.FileVersion
          if ($v -ne "${{ steps.version.outputs.version }}.0") { throw "Embedded FileVersion '$v' does not match Cargo.toml" }
          "KBMixer.exe: $($exe.Length) bytes, FileVersion $v"
          "sha256=$((Get-FileHash $exe -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-r${{ github.run_number }}
          name: KBMixer v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          body: |
            Automated build from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on `main`.

            **Download:** `KBMixer.exe` (win-x64) is a single self-contained executable with no dependencies. It runs on any 64-bit Windows 10/11 machine with nothing else installed. Profiles in `%APPDATA%\KBMixer` carry over from earlier versions.

            SHA-256: `${{ env.sha256 }}`
          files: rust/target/release/KBMixer.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
